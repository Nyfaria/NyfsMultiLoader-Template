plugins {
    // Required for NeoGradle
    alias(libs.plugins.loom) apply false
    alias(libs.plugins.mdg) apply false
    alias(libs.plugins.regutils)
    // The plugin is located at the Gradle plugin portal
}

configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor(1, "seconds")
}

registrationUtils {
    group "com.nyfaria.${mod_id}.registration"
    projects {
        fabric {
            type 'fabric'
        }
        forge {
            type 'forge'
        }
        common {
            type 'common'
        }
    }
}

