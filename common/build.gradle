plugins {
    id 'multiloader-common'
    alias(nyfs.plugins.mdg.loader)
    alias(nyfs.plugins.regutils.loader)
}

neoForge {
    neoFormVersion = nyfs.versions.neoFormVersion.get()
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = nyfs.versions.parchmentMinecraft.get()
        mappingsVersion = nyfs.versions.parchmentVersion.get()
    }
}

dependencies {
    compileOnly(nyfs.bundles.mixin.common)
    annotationProcessor nyfs.mixin.extras.common
    compileOnly nyfs.config.api.common
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

